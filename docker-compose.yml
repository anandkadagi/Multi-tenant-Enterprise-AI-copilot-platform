services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: AI_Copilot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    expose:
      - "6333"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/AI_Copilot
    depends_on:
      - postgres
    expose:
      - "5000"

  ai-service:
    build:
      context: ./AI-services
    restart: unless-stopped
    env_file:
      - ./AI-services/.env
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
    depends_on:
      - qdrant
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend/my-app
      args:
        NEXT_PUBLIC_API_URL: 
    restart: unless-stopped
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.config:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend  

volumes:
  postgres_data:
  qdrant_data:

  