name: CI

on:
  pull_request:
  push:
    branches: [main]

# if a newer commit lands on the same branch, stop the older run instead of queueing it
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-prisma:
    name: Validate Prisma schema
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # schema.prisma reads env("DATABASE_URL"), so validate needs a value present.
      # It is never connected to; this is a placeholder only.
      - run: npx prisma validate
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/placeholder

  build-images:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      # one failing image should not hide the status of the other two
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./backend
            build_args: ""
          - service: ai-service
            context: ./AI-services
            build_args: ""
          - service: frontend
            context: ./frontend/my-app
            # NEXT_PUBLIC_* values are baked into the JS at build time
            build_args: |
              NEXT_PUBLIC_API_URL=
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false # CI only checks that the image builds; publishing comes in the next step
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
