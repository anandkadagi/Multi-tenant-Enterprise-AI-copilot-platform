
name: Publish Docker Images

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish images to GHCR
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set image names
        shell: bash
        run: |
          echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-backend:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_PREFIX }}-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Publish AI service
        uses: docker/build-push-action@v6
        with:
          context: ./AI-services
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-ai-service:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_PREFIX }}-ai-service:latest
          cache-from: type=gha,scope=ai-service
          cache-to: type=gha,mode=max,scope=ai-service

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend/my-app
          push: true
          tags: |
            ghcr.io/anandkadagi/multi-tenant-enterprise-ai-copilot-platform-frontend:${{ github.sha }}
            ghcr.io/anandkadagi/multi-tenant-enterprise-ai-copilot-platform-frontend:latest
          build-args: |
            NEXT_PUBLIC_API_URL=/api
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
  
  deploy:
    name: Deploy to production EC2
    needs: publish
    if: >-
      success() &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    # Do not run two production deployments concurrently.
    concurrency:
      group: production-ec2-deploy
      cancel-in-progress: false

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AWS_REGION"
          test -n "$EC2_INSTANCE_ID"
          test -n "$IMAGE_TAG"
          echo "Deploying commit: $IMAGE_TAG"
          echo "Target EC2 instance: $EC2_INSTANCE_ID"
          echo "AWS region: $AWS_REGION"

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Deploy through AWS Systems Manager
        shell: bash
        run: |
          set -euo pipefail

          PARAMETERS=$(jq -n --arg tag "$IMAGE_TAG" '{
            commands: [
              "set -euo pipefail",
              "cd /home/ubuntu/Multi-tenant-Enterprise-AI-copilot-platform",
              "test -f docker-compose.prod.yml",
              ("sudo env IMAGE_TAG=" + $tag + " docker compose -f docker-compose.prod.yml pull"),
              ("sudo env IMAGE_TAG=" + $tag + " docker compose -f docker-compose.prod.yml up -d --remove-orphans"),
              "for attempt in $(seq 1 20); do if curl -fsS http://localhost/ >/dev/null; then echo HEALTH_CHECK_OK; break; fi; if [ \"$attempt\" -eq 20 ]; then echo HEALTH_CHECK_FAILED; sudo docker compose -f docker-compose.prod.yml ps; exit 1; fi; sleep 5; done",
              "sudo docker compose -f docker-compose.prod.yml ps"
            ]
          }')

          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --comment "Deploy application commit $IMAGE_TAG" \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          for attempt in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query '{Status:Status,Output:StandardOutputContent}' \
                  --output json
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Undeliverable|Terminated)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
                  --output json
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Timed out waiting for SSM deployment to finish."
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json || true
          exit 1
