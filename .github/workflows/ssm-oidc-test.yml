name: Test AWS OIDC and SSM

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ssm-oidc-test
  cancel-in-progress: false

jobs:
  test-ssm:
    name: Test OIDC and inspect EC2
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Inspect EC2 deployment environment
        shell: bash
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -u",
              "echo INSTANCE",
              "hostname",
              "echo CURRENT_DIRECTORY",
              "pwd",
              "echo COMPOSE_FILES",
              "sudo find /opt /srv /home/ubuntu -maxdepth 4 -type f -name compose.yaml -print 2>/dev/null || true",
              "sudo find /opt /srv /home/ubuntu -maxdepth 4 -type f -name compose.yml -print 2>/dev/null || true",
              "sudo find /opt /srv /home/ubuntu -maxdepth 4 -type f -name docker-compose.yaml -print 2>/dev/null || true",
              "sudo find /opt /srv /home/ubuntu -maxdepth 4 -type f -name docker-compose.yml -print 2>/dev/null || true",
              "echo DOCKER_VERSION",
              "sudo docker --version",
              "echo COMPOSE_VERSION",
              "sudo docker compose version",
              "echo RUNNING_CONTAINERS",
              "sudo docker ps",
              "echo DISK_SPACE",
              "df -h /",
              "echo MEMORY",
              "free -h"
            ]' \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command ID: $COMMAND_ID"
          STATUS="Pending"

          for attempt in $(seq 1 36); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            case "$STATUS" in
              Success|Failed|TimedOut|Cancelled|Cancelling)
                break
                ;;
            esac
            sleep 5
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json

          if [[ "$STATUS" != "Success" ]]; then
            echo "SSM diagnostic failed: $STATUS"
            exit 1
          fi
