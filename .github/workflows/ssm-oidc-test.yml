name: Test AWS OIDC and SSM

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ssm-oidc-test
  cancel-in-progress: false

jobs:
  test-ssm:
    name: Test OIDC and inspect EC2
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          set -euo pipefail
          aws sts get-caller-identity

      - name: Inspect EC2 deployment environment
        shell: bash
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail

          if [[ -z "$EC2_INSTANCE_ID" ]]; then
            echo "EC2_INSTANCE_ID repository variable is empty or missing."
            exit 1
          fi

          echo "Sending read-only diagnostic commands to EC2..."

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -u",
              "echo === Instance ===",
              "hostname",
              "echo === Current directory ===",
              "pwd",
              "echo === Compose files ===",
              "sudo find /opt /srv /home/ubuntu -maxdepth 4 -type f -name compose.yaml -print 2>/dev/null || true",
              "sudo find /opt /srv /home/ubuntu -maxdepth 4 -type f -name compose.yml -print 2>/dev/null || true",
              "sudo find /opt /srv /home/ubuntu -maxdepth 4 -type f -name docker-compose.yaml -print 2>/dev/null || true",
              "sudo find /opt /srv /home/ubuntu -maxdepth 4 -type f -name docker-compose.yml -print 2>/dev/null || true",
              "echo === Docker version ===",
              "sudo docker --version",
              "echo === Docker Compose version ===",
              "sudo docker compose version",
              "echo === Running containers ===",
              "sudo docker ps --format 'table {{.Names}}\\t{{.Image}}\\t{{.Status}}\\t{{.Ports}}'",
              "echo === Disk space ===",
              "df -h /",
              "echo === Memory ===",
              "free -h"
            ]' \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          STATUS="Pending"

          for attempt in $(seq 1 36); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            case "$STATUS" in
              Success|Failed|TimedOut|Cancelled|Cancelling)
                break
                ;;
            esac

            sleep 5
          done

          echo "=== SSM diagnostic result ==="

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json

          if [[ "$STATUS" != "Success" ]]; then
            echo "SSM diagnostic command did not succeed. Status: $STATUS"
            exit 1
          fi
